<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9fd062">
<title>Windy Drive</title>
<style>
  /* Safe areas: env() on iOS / modern WebViews, Capacitor's injected vars as fallback on older Android WebViews. */
  :root{--sat:env(safe-area-inset-top,var(--safe-area-inset-top,0px));--sab:env(safe-area-inset-bottom,var(--safe-area-inset-bottom,0px))}
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd062;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
